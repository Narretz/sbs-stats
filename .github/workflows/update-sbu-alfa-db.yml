name: Update SBU Alfa Database

# Scheduled ingest of NEW recaps, found on SBU's Telegram channel
# (scripts/sbu_alfa/telegram.py) — not on ssu.gov.ua, whose news listing sits
# behind an Akamai rule that has already tightened once (README "Source
# quirks"); discover.py, which scans that listing, is kept for manual use.
#
# After a parser change, this is the half to run when the parser DROPPED a
# recap (it was never stored, so only a re-scan can recover it: dispatch with
# `rescan` on and enough `pages` to reach it — ~12 pages a month back). When
# the parser MISREAD a recap it already stored, run reparse-sbu-alfa-db.yml
# instead — a re-scan re-reads identical text.
on:
  workflow_dispatch: # allow manual trigger from GitHub UI
    inputs:
      pages:
        description: >-
          Most channel preview pages to walk (~2.5 days of posts each). The
          walk normally stops at the newest stored post well before this.
        required: false
        default: "25"
      rescan:
        description: >-
          Walk all `pages`, past the newest stored post — to recover a recap
          a parser fix now accepts.
        type: boolean
        required: false
        default: false
  schedule:
    # SBU publishes each monthly recap between the 6th and the 17th of the
    # following month (three known data points; wider than that in practice).
    # Run once a day between days 5 and 20 of every month — 16 runs/mo — which
    # covers the whole plausible window with a couple of days of slack.
    # A run walks back to last month's recap, ~12 preview pages (~1 MB) on
    # the first runs of a month and one page once this month's is stored.
    - cron: "0 8 5-20 * *"

env:
  R2_BUCKET: russia-ukraine-war
  SBU_ALFA_DB_NAME: sbu-alfa.db

jobs:
  update-sbu-alfa-db:
    runs-on: ubuntu-latest

    env:
      # Findings from this job land here as JSONL; the last step turns them
      # into annotations. See scripts/ingest_log.py. The one finding this
      # ingest raises is "a counter line matched no category" — SBU's case
      # endings shift with the preceding numeral, so a recap can quietly lose
      # a category, and a stderr line in a once-a-month green run is not a
      # place anyone looks.
      #
      # `github.workspace`, not `runner.temp`: the runner context isn't
      # available in a job-level env block (only in steps).
      INGEST_LOG: ${{ github.workspace }}/ingest-diagnostics.jsonl

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Pull the current DB: the walk stops at the newest post already in it,
      # and new rows land alongside the existing history. `continue-on-error`
      # covers the first run when the object may not yet exist — the walk then
      # just goes the full `pages`.
      - name: Download current SBU Alfa DB from R2
        id: download
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p data
          npx --yes wrangler@4 r2 object get \
            "$R2_BUCKET/$SBU_ALFA_DB_NAME" \
            --file "data/$SBU_ALFA_DB_NAME" \
            --remote

      # telegram.py: walk t.me/s/SBUkr newest-first to the newest stored post
      # and store each post that passes parse.is_monthly_recap (a month AND a
      # recap's worth of counters), under its own t.me URL. stdlib only.
      #
      # `id:` + $GITHUB_OUTPUT: telegram.py writes `changed=true|false`,
      # which the upload step below reads to skip no-op runs. Unlike the
      # other datasets, SBU Alfa publishes ~once/month and we poll ~16×/mo
      # — so ≥94% of runs would otherwise upload an unchanged DB and bust
      # the CDN cache for zero benefit.
      - name: Find + ingest new SBU Alfa recaps (Telegram)
        id: ingest
        run: |
          python3 scripts/sbu_alfa/telegram.py \
            --out "data/$SBU_ALFA_DB_NAME" \
            --pages "${{ inputs.pages || '25' }}" \
            ${{ inputs.rescan && '--rescan' || '' }}

      - name: Upload SBU Alfa DB to R2
        if: steps.ingest.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 object put \
            "$R2_BUCKET/$SBU_ALFA_DB_NAME" \
            --file "data/$SBU_ALFA_DB_NAME" \
            --content-type application/vnd.sqlite3 \
            --remote

      # Always, so a scan that dies still reports what it found on the way.
      - name: Annotate ingest diagnostics
        if: always()
        run: python3 scripts/annotate_log.py
