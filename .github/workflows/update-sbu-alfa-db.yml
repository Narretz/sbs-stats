name: Update SBU Alfa Database

# Which mode to run after a parser change (the same split as
# reparse-gsua-db.yml, but folded into this workflow — SBU Alfa is one article
# a month, so a second workflow would be more ceremony than the job is worth):
#   - the parser DROPPED a recap (it was never stored)  → raise `pages`;
#     only a re-scan can recover a report that was never written
#   - the parser MISREAD a recap it stored              → tick `reparse`;
#     discover.py skips URLs already in the DB, so a re-scan changes nothing
on:
  workflow_dispatch: # allow manual trigger from GitHub UI
    inputs:
      pages:
        description: >-
          Listing pages to scan. Raise it to reach recaps older than the default
          3-page window — e.g. to re-ingest a recap the parser previously
          rejected (a rejected report is never stored, so only a re-scan can
          recover it).
        required: false
        default: "3"
      reparse:
        description: >-
          Re-read the article text already stored in the DB with the current
          parser, before scanning. Run this after a parser fix: a recap already
          in the DB is skipped on URL by the scan, so a re-run would otherwise
          change nothing. Appends a new version of each report whose counters
          changed; never overwrites.
        type: boolean
        required: false
        default: false
      dry_run:
        description: >-
          Reparse only. Preview the per-counter diff and write nothing, leaving
          R2 untouched. Default on — read the diff once before committing to it.
        type: boolean
        required: false
        default: true
  schedule:
    # SBU publishes each monthly recap between the 6th and the 17th of the
    # following month (three known data points; wider than that in practice).
    # Run once a day between days 5 and 20 of every month — 16 runs/mo — which
    # covers the whole plausible window with a couple of days of slack.
    # Fetching ~3 listing pages per run is ~230 KB total; negligible.
    - cron: "0 8 5-20 * *"

env:
  R2_BUCKET: russia-ukraine-war
  SBU_ALFA_DB_NAME: sbu-alfa.db

jobs:
  update-sbu-alfa-db:
    runs-on: ubuntu-latest

    env:
      # Findings from this job land here as JSONL; the last step turns them
      # into annotations. See scripts/ingest_log.py. The one finding this
      # ingest raises is "a counter line matched no category" — SBU's case
      # endings shift with the preceding numeral, so a recap can quietly lose
      # a category, and a stderr line in a once-a-month green run is not a
      # place anyone looks.
      #
      # `github.workspace`, not `runner.temp`: the runner context isn't
      # available in a job-level env block (only in steps).
      INGEST_LOG: ${{ github.workspace }}/ingest-diagnostics.jsonl

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Pull the current DB so discover.py can dedupe against `reports.url`
      # and so newly-ingested rows land alongside the existing history.
      # `continue-on-error` covers the first run when the object may not
      # yet exist — discover.py would then just have an empty seen-set.
      - name: Download current SBU Alfa DB from R2
        id: download
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p data
          npx --yes wrangler@4 r2 object get \
            "$R2_BUCKET/$SBU_ALFA_DB_NAME" \
            --file "data/$SBU_ALFA_DB_NAME" \
            --remote

      # Parser-fix path: re-read the stored `reports.body_text` with the
      # current parser (no fetch — SBU's CDN 403s a large share of automated
      # requests, and the text is stored precisely so this never needs one).
      # Dry run unless `dry_run` is unchecked; writes `changed=` like the scan
      # step below, so the upload is skipped when the re-parse is a no-op.
      - name: Re-parse stored SBU Alfa reports
        id: reparse
        if: ${{ inputs.reparse }}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          apply=""
          [ "$DRY_RUN" = "true" ] || apply="--apply"
          python3 scripts/sbu_alfa/ingest.py --reparse \
            --out "data/$SBU_ALFA_DB_NAME" $apply

      # discover.py: scan the SBU news listing for candidate Alfa monthly-
      # recap URLs, filter out ones already stored, ingest each new one.
      # Slug-filter false positives are gated (parser must recognise
      # report_type='monthly_top1' with a valid period) so a drifted slug
      # can't land garbage in the DB. stdlib only.
      #
      # `id:` + $GITHUB_OUTPUT: discover.py writes `changed=true|false`,
      # which the upload step below reads to skip no-op runs. Unlike the
      # other datasets, SBU Alfa publishes ~once/month and we poll ~16×/mo
      # — so ≥94% of runs would otherwise upload an unchanged DB and bust
      # the CDN cache for zero benefit.
      - name: Discover + ingest new SBU Alfa recaps
        id: discover
        run: |
          python3 scripts/sbu_alfa/discover.py \
            --out "data/$SBU_ALFA_DB_NAME" \
            --pages "${{ inputs.pages || '3' }}"

      # Either path can have changed the DB — the reparse step only reports
      # `changed=true` when it actually wrote (never on a dry run).
      - name: Upload SBU Alfa DB to R2
        if: steps.discover.outputs.changed == 'true' || steps.reparse.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 object put \
            "$R2_BUCKET/$SBU_ALFA_DB_NAME" \
            --file "data/$SBU_ALFA_DB_NAME" \
            --content-type application/vnd.sqlite3 \
            --remote

      # Always, so a scan that dies still reports what it found on the way.
      - name: Annotate ingest diagnostics
        if: always()
        run: python3 scripts/annotate_log.py
