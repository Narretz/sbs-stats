name: Update UA Losses Database

# Confirmed Ukrainian military personnel losses from ualosses.org, published on
# Kaggle (ol4ubert/confirmed-ukrainian-military-personnel-losses). Kaggle-only
# source: needs a free account's API token, stored as the KAGGLE_USERNAME /
# KAGGLE_KEY secrets (the two fields from kaggle.json).

on:
  workflow_dispatch: # allow manual trigger from the GitHub UI
  schedule:
    # ualosses re-uploads the workbook every ~2 months (observed 29–89-day gaps)
    # and revises past days each time (new IDs + reclassifications). Twice a month
    # (07:00 UTC on the 1st and 15th) catches a new release within ~2 weeks while
    # avoiding a daily 30 MB no-op download. Append-on-change means a run that
    # finds no new Kaggle version inserts nothing (scraped_at is the data vintage,
    # so re-ingesting the same version is a no-op).
    - cron: "0 7 1,15 * *"

# Single source of truth for the bucket + DB filename.
env:
  R2_BUCKET: russia-ukraine-war
  UA_LOSSES_DB_NAME: ua-losses.db

jobs:
  update-ua-losses-db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # This ingest parses xlsx, so openpyxl is required (unlike the stdlib-only
      # scrapers). Install just that one dep — no need for the full requirements.
      - name: Install openpyxl
        run: pip install "openpyxl>=3.1.0"

      # Pull the current DB so the build APPENDS into it (versioned, never
      # deletes) rather than starting empty — preserving every prior `scraped_at`
      # version per date. `continue-on-error` so the very first run (object not
      # yet in R2) still works: ingest creates it fresh.
      - name: Download current UA Losses DB from R2
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p scripts/ua_losses/output
          npx --yes wrangler@4 r2 object get \
            "$R2_BUCKET/$UA_LOSSES_DB_NAME" \
            --file "scripts/ua_losses/output/$UA_LOSSES_DB_NAME" \
            --remote

      # ingest.py --latest resolves + downloads the current Kaggle version, appends
      # changed/new date-rows, and aborts WITHOUT writing if the workbook looks
      # truncated (row-count floor; never fewer dates than already stored) — so a
      # bad fetch fails this step and the upload below is skipped, leaving R2
      # untouched.
      - name: Build UA Losses DB
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p scripts/ua_losses/output
          python3 scripts/ua_losses/ingest.py --latest \
            --out "scripts/ua_losses/output/$UA_LOSSES_DB_NAME"

      - name: Upload UA Losses DB to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 object put \
            "$R2_BUCKET/$UA_LOSSES_DB_NAME" \
            --file "scripts/ua_losses/output/$UA_LOSSES_DB_NAME" \
            --content-type application/vnd.sqlite3 \
            --remote
