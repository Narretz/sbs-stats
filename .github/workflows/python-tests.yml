name: Python tests

# The ingest parsers read unstructured sources (Telegram posts, press releases,
# CSV/xlsx exports) and their tests are the only thing standing between a
# regex tweak and a dataset that quietly loses a category. They ran by hand
# until now, so a parser change could reach main untested — and the scheduled
# ingest workflows are no safety net: they exercise the happy path against
# whatever the source published today and stay green while a fixture case
# breaks.
#
# On push for any branch, not just main: the point is to catch it before the
# merge, and these suites take seconds.
on:
  push:
    paths:
      - "scripts/**/*.py"
      - "scripts/*.py"
      - "scripts/test_python.sh"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # pytest only. The suites are stdlib-only by design, like the ingest
      # paths they cover: the sole module-level third-party imports under
      # scripts/ are playwright in gsua's scrape_facebook / scrape_twitter,
      # which no test imports, and telethon is imported lazily inside the
      # functions that need it. If a suite ever does need a real dependency,
      # install scripts/requirements.txt here instead.
      - name: Install pytest
        run: pip install "pytest>=8.0.0"

      # One pytest process per dataset directory — see the script's header for
      # why they can't share one.
      - name: Run ingest test suites
        run: bash scripts/test_python.sh
