name: Update RU Losses Database

on:
  # No GitHub schedule: dispatched daily at 09:10 Kyiv by the Cloudflare cron
  # Worker (cloudflare/worker.ts). The General Staff publishes once a day and
  # PetroIvaniuk mirrors it within hours.
  workflow_dispatch:

# Single source of truth for the bucket + DB filename.
env:
  R2_BUCKET: russia-ukraine-war
  RU_LOSSES_DB_NAME: ru-losses-gsua-petroivaniuk.db

jobs:
  update-ru-losses-db:
    runs-on: ubuntu-latest

    env:
      # Findings from every check in this job land here as JSONL; the last
      # step turns them into annotations. See scripts/ingest_log.py.
      #
      # `github.workspace`, not `runner.temp`: the runner context isn't
      # available in a job-level env block (only in steps), and the path has to
      # be absolute because the ingest steps set their own working-directory.
      INGEST_LOG: ${{ github.workspace }}/ingest-diagnostics.jsonl
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Pull the current DB so the build appends into it (append-only, never
      # delete) rather than starting from empty — this preserves any dates the
      # source might later drop. r2_get_db.py retries and otherwise fails the
      # job, so a failed download can't upload a fresh DB without them.
      - name: Download current RU losses DB from R2
        id: download
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/r2_get_db.py "$R2_BUCKET/$RU_LOSSES_DB_NAME" "scripts/ru_losses/output/$RU_LOSSES_DB_NAME"

      # ingest.py merges the fetched days into the (downloaded) DB and aborts
      # without writing if the fetch looks partial/broken — so a bad upstream
      # response fails this step and the upload below is skipped, leaving R2
      # untouched. stdlib only, so no pip install needed. GITHUB_TOKEN is the
      # workflow-scoped default token (no extra secret needed); the ingest
      # uses it on Contents-API calls to lift the anonymous 60 req/h limit to
      # 5000/h — relevant only if the cron ever lines up with another action
      # hitting the same IP.
      - name: Build RU losses DB
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p scripts/ru_losses/output
          python3 scripts/ru_losses/ingest.py \
            --out "scripts/ru_losses/output/$RU_LOSSES_DB_NAME"

      - name: Upload RU losses DB to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 object put \
            "$R2_BUCKET/$RU_LOSSES_DB_NAME" \
            --file "scripts/ru_losses/output/$RU_LOSSES_DB_NAME" \
            --content-type application/vnd.sqlite3 \
            --remote

      # Always, so a run that dies still reports what it found on the way.
      - name: Annotate ingest diagnostics
        if: always()
        run: python3 scripts/annotate_log.py
