name: Node tests

# The frontend counterpart to python-tests.yml. Same reasoning: `.githooks/
# pre-push` runs the full sweep locally, but nothing ran it in CI, so a change
# pushed from a container without the hooks installed — an agent's branch, a
# `--no-verify`, a web session — reached main unchecked.
#
# Eslint and both Vitest tiers — the unit tests (plain Node, sub-second) and
# the component tests (one component at a time in Chromium, seconds) — but NOT
# the Playwright e2e suite, which builds the app and the `.env.e2e` fixture DBs
# and takes minutes per run; the pre-push hook is where that sweep belongs.
#
# Both triggers, for the reasons python-tests.yml spells out: `push` for the
# earliest signal on any branch, `pull_request` so the PR's own checks reflect
# the whole diff rather than whatever its last commit happened to touch.
on:
  push:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig*.json"
      - ".eslintrc*"
      - "eslint.config.*"
      - ".github/workflows/node-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig*.json"
      - ".eslintrc*"
      - "eslint.config.*"
      - ".github/workflows/node-tests.yml"
  workflow_dispatch:

jobs:
  node:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      # Node 24 and `cache: npm`, matching deploy.yml — a test run that passes
      # on a different major than the one that builds the site is worth less.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Both run even if the first fails: a lint error and a test failure are
      # independent findings, and one run should report both rather than making
      # the next push discover the second.
      - name: Lint
        id: lint
        run: npm run lint

      - name: Unit tests
        id: unit
        if: always() && steps.lint.conclusion != 'cancelled'
        run: npm test

      # The component tier (`*.browser.test.tsx`) mounts components in a real
      # Chromium — seconds, unlike the Playwright e2e suite, which stays in the
      # pre-push hook.
      - name: Install Chromium
        if: always() && steps.lint.conclusion != 'cancelled'
        run: npx playwright install --with-deps chromium

      - name: Component tests
        if: always() && steps.lint.conclusion != 'cancelled'
        run: npm run test:browser
