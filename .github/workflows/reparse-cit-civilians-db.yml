name: Reparse CIT Civilians Database

# Manual-only. Re-reads the post text ALREADY stored in cit-civilians.db
# (`reports.body_text`) with the current parser — no Telegram fetch.
#
# This is the other half of the parser-fix loop, and it is deliberately NOT part
# of update-cit-civilians-db.yml: that workflow's job is to ingest new posts on a
# schedule, this one re-reads history on demand. They differ in trigger, blast
# radius, and failure mode, so they stay separate.
#
# Which one to run after a parser change:
#   - the parser DROPPED a post (it was never stored)    → re-scrape:
#     update-cit-civilians-db.yml with a widened `pages`
#   - the parser MISREAD a post it stored                → this workflow;
#     a re-scrape re-ingests identical text and changes nothing

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Preview only: log which stored posts would change and skip the
          upload, leaving R2 untouched. Uncheck to write, which stores a new
          version of each post whose parse changed and re-uploads the DB.
        type: boolean
        required: false
        default: true

env:
  R2_BUCKET: russia-ukraine-war
  CIT_DB_NAME: cit-civilians.db
  # Diagnostics sink; scripts/annotate_log.py turns it into annotations and a
  # job-summary table at the end of the run (CLAUDE.md).
  INGEST_LOG: ${{ github.workspace }}/ingest-diagnostics.jsonl

jobs:
  reparse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # NOTE: no continue-on-error — the history (seeded by a local backfill)
      # lives only in R2. A failed download must abort, never fall through to
      # an upload that would overwrite the good object with an empty DB.
      - name: Download current CIT DB from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p data
          npx --yes wrangler@4 r2 object get \
            "$R2_BUCKET/$CIT_DB_NAME" \
            --file "data/$CIT_DB_NAME" \
            --remote

      # `--reparse` is a dry run unless `--apply` is passed. With `--apply` it
      # writes `changed=true|false` to $GITHUB_OUTPUT, which gates the upload;
      # a dry run always writes `changed=false`.
      - name: Re-parse stored posts
        id: reparse
        run: |
          ARGS="--reparse"
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            ARGS="$ARGS --apply"
          fi
          echo "ingest.py $ARGS"
          python3 scripts/cit_civilians/ingest.py --out "data/$CIT_DB_NAME" $ARGS 2>&1 \
            | tee reparse.log
          {
            echo "### CIT reparse (\`$ARGS\`)"
            echo ""
            echo '```'
            grep 'reparsed .* stored post' reparse.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Same app copy the scheduled workflow builds; the frontend reads it, so
      # it has to be rebuilt from the reparsed data or the site keeps serving
      # the old values.
      - name: Build app CIT DB (strip raw text)
        if: steps.reparse.outputs.changed == 'true'
        run: |
          python3 scripts/build_app_db.py \
            --in "data/$CIT_DB_NAME" \
            --out "data/cit-civilians.app.db" \
            --blank reports.body_text \
            --blank casualties.raw_label \
            --blank casualties.region_raw

      - name: Upload CIT DB to R2 (full + app)
        if: steps.reparse.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for variant in "$CIT_DB_NAME" cit-civilians.app.db; do
            npx --yes wrangler@4 r2 object put \
              "$R2_BUCKET/$variant" \
              --file "data/$variant" \
              --content-type application/vnd.sqlite3 \
              --remote
          done

      # Always, so a run that dies still reports what it found on the way.
      - name: Annotate ingest diagnostics
        if: always()
        run: python3 scripts/annotate_log.py
