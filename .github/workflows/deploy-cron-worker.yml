name: Deploy cron worker

# Deploys cloudflare/ — the `sbs-stats-cron` Worker whose cron trigger
# dispatches update-db.yml (the SBS hourly ingest has no `schedule:` of its
# own). Before this workflow the Worker was deployed by hand, so the live
# schedule could drift from wrangler.toml unnoticed.
#
# A pull request only bundles it (`--dry-run`, no credentials), so a broken
# worker.ts is caught before it reaches main and silently stops the ingest.
#
# Requires repo secret CLOUDFLARE_WORKERS_API_TOKEN, deliberately separate
# from the R2-only CLOUDFLARE_API_TOKEN the ingests use: a Cloudflare custom
# token with `Account → Workers Scripts → Edit` on this account. Plus the
# existing CLOUDFLARE_ACCOUNT_ID.
#
# The Worker's own GH_TOKEN secret is NOT set here — Worker secrets survive a
# deploy, so it stays whatever `wrangler secret put GH_TOKEN` last set.
on:
  push:
    branches: [main]
    paths:
      - "cloudflare/worker.ts"
      - "cloudflare/wrangler.toml"
      - "cloudflare/package.json"
      - "cloudflare/package-lock.json"
      - "cloudflare/tsconfig.json"
      - ".github/workflows/deploy-cron-worker.yml"
  pull_request:
    paths:
      - "cloudflare/worker.ts"
      - "cloudflare/wrangler.toml"
      - "cloudflare/package.json"
      - "cloudflare/package-lock.json"
      - "cloudflare/tsconfig.json"
      - ".github/workflows/deploy-cron-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cron-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Bundle (dry run)
        if: github.event_name == 'pull_request'
        run: npx wrangler deploy --dry-run --outdir dist

      - name: Deploy
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
