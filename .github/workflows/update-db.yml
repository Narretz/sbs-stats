name: Update SBS Database

on:
  workflow_dispatch: # allow manual trigger from GitHub UI
    inputs:
      all_months:
        description: >-
          Re-fetch every month, ignoring the 10-day-after-month-end and 6-hour
          freshness thresholds. The SBS equivalent of a widened lookback — use
          it to re-pull history after an ingest fix.
        type: boolean
        required: false
        default: false
      units_all:
        description: >-
          Sub-units: re-read every month and year the API still exposes. Use
          after an ingest fix, or if check_db reports an uncaptured month — the
          monthly period slots only hold twelve months and a month that rolls
          out of that window is unrecoverable.
        type: boolean
        required: false
        default: false

jobs:
  update-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed for `gh release` (Releases live under contents)

    env:
      # Naming a sink turns the ingest's warnings into GitHub annotations via
      # the Annotate step below. Unset locally, so a dev run stays console-only.
      INGEST_LOG: ${{ github.workspace }}/ingest-diagnostics.jsonl

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      # R2 is the source of truth — pull the current DB down so the scraper
      # runs incrementally against the live state. Without this, each run
      # starts from the frozen committed snapshot and the subsequent upload
      # silently drops everything captured by previous runs.
      - name: Download current DB from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 object get \
            russia-ukraine-war/sbs.db \
            --file data/sbs.db \
            --remote

      - name: Run data fetcher
        env:
          DB_PATH: data/sbs.db
          SUMMARY_PATH: /tmp/update-summary.txt
        run: python scripts/fetch_and_update.py ${{ inputs.all_months && '--all-months' || '' }}

      # Publish the same DB as a rolling `latest` release asset. Overwriting
      # the same asset URL each run keeps total Release storage at ~1 MB, no
      # history accrual. Released bytes are CDN-served with range support.
      # Unconditional: `--clobber` is idempotent and Release API calls are
      # well within free-tier limits.
      - name: Upload DB to rolling `latest` release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest \
              --title "Latest data snapshot" \
              --notes "Rolling release. Always overwritten by the most recent update-db run." \
              --prerelease
          fi
          SUMMARY=$(cat /tmp/update-summary.txt 2>/dev/null || echo "update")
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          NOTES=$(printf 'Last updated: %s\n\n%s' "$TIMESTAMP" "$SUMMARY")
          gh release upload latest data/sbs.db --clobber
          gh release edit latest --notes "$NOTES"

      # Upload to Cloudflare R2 (browser-fetchable with CORS, unlike the
      # Release CDN). One-time setup of the bucket + CORS lives in
      # cloudflare/r2-cors.json. Requires repo secrets CLOUDFLARE_API_TOKEN
      # (R2 Edit, scoped to the russia-ukraine-war bucket) and
      # CLOUDFLARE_ACCOUNT_ID. Unconditional: PUT is idempotent and well
      # within R2 free-tier limits.
      - name: Upload DB to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 object put \
            russia-ukraine-war/sbs.db \
            --file data/sbs.db \
            --content-type application/vnd.sqlite3 \
            --remote

      # ── Sub-units ──────────────────────────────────────────────────────────
      # Separate DB, same trigger. It lives here rather than in its own
      # workflow because it reads the same API and shares the ingest's HTTP and
      # validation helpers; it runs after the sbs.db upload so a failure here
      # can never cost the grouping data. The script's own --min-interval-hours
      # makes it a cheap no-op on most of the hourly ticks.
      - name: Download sub-units DB from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 object get \
            russia-ukraine-war/sbs-units.db \
            --file data/sbs-units.db \
            --remote || echo "no sbs-units.db on R2 yet — starting fresh"

      - name: Run sub-units ingest
        id: units
        env:
          SBS_UNITS_DB_PATH: data/sbs-units.db
          SUMMARY_PATH: /tmp/units-summary.txt
        run: python3 scripts/sbs_units/ingest.py ${{ inputs.units_all && '--all' || '' }}

      # Whole-table checks: a stalled unit, a month the API lists that we never
      # captured, a closed month that moved by more than the source's usual
      # revision noise. Non-blocking — findings surface as annotations.
      - name: Check sub-units DB
        if: always()
        run: python3 scripts/sbs_units/check_db.py --db data/sbs-units.db || true

      - name: Upload sub-units DB to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 object put \
            russia-ukraine-war/sbs-units.db \
            --file data/sbs-units.db \
            --content-type application/vnd.sqlite3 \
            --remote

      # Always, so a run that dies still reports what it found on the way.
      - name: Annotate ingest diagnostics
        if: always()
        run: python3 scripts/annotate_log.py
