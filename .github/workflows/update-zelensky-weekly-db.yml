name: Update Zelensky Weekly Strikes Database

on:
  workflow_dispatch: # allow manual trigger from GitHub UI
    inputs:
      pages:
        description: >-
          Max t.me/s preview pages to scan (~20 posts each; this channel posts
          ~17 a day). The walk stops at the newest stored post anyway, so this
          only matters to reach further back after a parser fix dropped a
          tally — a dropped post is never stored, so only a re-scrape can
          recover it. For the whole history use `--backfill` locally.
        required: false
        default: "15"
  schedule:
    # The tally is posted Sunday morning Kyiv time — sometimes Saturday,
    # occasionally Monday ("за минулий тиждень"). One run each evening
    # Sat/Sun/Mon; the incremental walk stops at the previous tally, so the
    # runs overlap harmlessly and most of them upload nothing.
    - cron: "0 20 * * 6,0,1"
      timezone: "Europe/Kyiv"

env:
  R2_BUCKET: russia-ukraine-war
  ZELENSKY_WEEKLY_DB_NAME: zelensky-weekly.db

jobs:
  update-zelensky-weekly-db:
    runs-on: ubuntu-latest

    env:
      # Findings land here as JSONL; the last step turns them into annotations
      # (scripts/ingest_log.py). What this ingest raises is "the tally names a
      # weapon whose number the parser couldn't read".
      INGEST_LOG: ${{ github.workspace }}/ingest-diagnostics.jsonl

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Pull the current DB so the incremental walk knows where to stop.
      # `continue-on-error` covers the first run before the object exists — an
      # empty DB scans only `pages`; the history is seeded by a local
      # `--backfill` + one manual upload (scripts/zelensky_weekly/README.md).
      - name: Download current DB from R2
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p data
          npx --yes wrangler@4 r2 object get \
            "$R2_BUCKET/$ZELENSKY_WEEKLY_DB_NAME" \
            --file "data/$ZELENSKY_WEEKLY_DB_NAME" \
            --remote

      # Public t.me/s preview — no Telegram account, no secrets, stdlib only.
      # Writes `changed=true|false` to $GITHUB_OUTPUT for the upload gate.
      - name: Scrape new weekly tallies
        id: scrape
        run: |
          python3 scripts/zelensky_weekly/ingest.py \
            --out "data/$ZELENSKY_WEEKLY_DB_NAME" \
            --max-pages "${{ inputs.pages || '15' }}"

      - name: Upload DB to R2
        if: steps.scrape.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 object put \
            "$R2_BUCKET/$ZELENSKY_WEEKLY_DB_NAME" \
            --file "data/$ZELENSKY_WEEKLY_DB_NAME" \
            --content-type application/vnd.sqlite3 \
            --remote

      # Always, so a scrape that dies still reports what it found on the way.
      - name: Annotate ingest diagnostics
        if: always()
        run: python3 scripts/annotate_log.py
