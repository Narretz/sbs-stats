name = "sbs-stats-cron"
main = "worker.ts"
compatibility_date = "2025-01-01"
workers_dev = false
preview_urls = false

[triggers]
# One trigger for every workflow: worker.ts (dispatchesFor) picks what each
# tick dispatches. SBS runs on every tick; the daily ones match a Kyiv-time
# tick at :10, so they need :10 to stay in this list.
crons = ["10,25,40,55 * * * *"]

[vars]
GH_OWNER = "narretz"
GH_REPO = "sbs-stats"
GH_REF = "main"

# Set the token with: wrangler secret put GH_TOKEN
